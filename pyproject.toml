[project]
name = "docqa"
version = "1.0.0"
description = "Question answering over Markdown docs with BM25 retrieval and cited answers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.6"]

[project.scripts]
docqa = "docqa.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
